name: Build Dev Image (GHCR + .tar)

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: write
  packages: write

concurrency:
  group: dev-image-tar
  cancel-in-progress: true

env:
  IMAGE_NAME: quark-auto-save
  IMAGE_TAG: dev
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/quark-auto-save
  RELEASE_TAG: dev-latest
  TAR_NAME: quark-auto-save-dev.tar

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dev image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: |
            MAINTAINER=${{ github.repository_owner }}
            BRANCH=${{ github.ref_name }}
            BUILD_SHA=${{ github.sha }}
            BUILD_TAG=${{ env.IMAGE_TAG }}

      - name: Push image to GHCR
        run: docker push "${GHCR_IMAGE}:${IMAGE_TAG}"

      - name: Export image to .tar (docker save)
        run: |
          docker save "${IMAGE_NAME}:${IMAGE_TAG}" -o "${TAR_NAME}"
          sha256sum "${TAR_NAME}" > "${TAR_NAME}.sha256"
          ls -lh "${TAR_NAME}" "${TAR_NAME}.sha256"
          echo "tar_size=$(stat -c %s "${TAR_NAME}")" >> "$GITHUB_OUTPUT"

      - name: Publish .tar as Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 || \
            gh release create "${RELEASE_TAG}" \
              --target dev \
              --title "Dev 镜像 (.tar)" \
              --notes "dev 分支自动构建的镜像（仅 linux/amd64）。
          在线拉取：docker pull ${GHCR_IMAGE}:${IMAGE_TAG}
          离线导入：docker load -i ${TAR_NAME}
          校验命令：sha256sum -c ${TAR_NAME}.sha256"
          gh release upload "${RELEASE_TAG}" "${TAR_NAME}" "${TAR_NAME}.sha256" --clobber

      - name: Upload .tar as workflow artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: quark-auto-save-dev-tar
          path: |
            ${{ env.TAR_NAME }}
            ${{ env.TAR_NAME }}.sha256
          retention-days: 14
          if-no-files-found: error
